<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<style>
  @page {
    size: A4;
    margin: 2cm 1.5cm;
    @bottom-center {
      content: "Page " counter(page) " of " counter(pages);
      font-size: 9px;
      color: #666;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 11pt;
    line-height: 1.6;
    color: #1a1a1a;
  }
  h1 { font-size: 22pt; color: #1a3a5c; margin-bottom: 8px; }
  h2 {
    font-size: 15pt; color: #1a3a5c;
    border-bottom: 2px solid #e0e7ef;
    padding-bottom: 4px;
    margin-top: 24px; margin-bottom: 12px;
  }
  h3 { font-size: 12pt; color: #2c5282; margin-top: 16px; margin-bottom: 8px; }
  p { margin-bottom: 8px; }
  .meta { color: #666; font-size: 10pt; margin-bottom: 20px; }
  table {
    width: 100%; border-collapse: collapse;
    margin: 12px 0; font-size: 10pt;
  }
  th, td {
    padding: 6px 10px; text-align: left;
    border-bottom: 1px solid #ddd;
  }
  th { background: #f0f4f8; font-weight: 600; }
  .severity-critical { background: #dc2626; color: #fff; padding: 2px 8px; border-radius: 3px; font-weight: 600; font-size: 9pt; }
  .severity-high    { background: #ea580c; color: #fff; padding: 2px 8px; border-radius: 3px; font-weight: 600; font-size: 9pt; }
  .severity-medium  { background: #ca8a04; color: #fff; padding: 2px 8px; border-radius: 3px; font-weight: 600; font-size: 9pt; }
  .severity-low     { background: #65a30d; color: #fff; padding: 2px 8px; border-radius: 3px; font-weight: 600; font-size: 9pt; }
  .severity-info    { background: #6b7280; color: #fff; padding: 2px 8px; border-radius: 3px; font-weight: 600; font-size: 9pt; }
  .badge { display: inline-block; }
  .summary-cards { display: flex; gap: 12px; margin: 16px 0; }
  .card {
    flex: 1; padding: 12px; border-radius: 6px;
    text-align: center; color: #fff;
  }
  .card-critical { background: #dc2626; }
  .card-high     { background: #ea580c; }
  .card-medium   { background: #ca8a04; }
  .card-low      { background: #65a30d; }
  .card-info     { background: #6b7280; }
  .card-num { font-size: 24pt; font-weight: 700; }
  .card-label { font-size: 9pt; opacity: 0.9; }
  .finding { margin: 12px 0; padding: 10px; border-left: 4px solid #cbd5e1; background: #f8fafc; border-radius: 0 4px 4px 0; }
  .remediation { margin-top: 8px; padding: 8px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 4px; font-size: 10pt; }
  .footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid #e0e7ef; font-size: 9pt; color: #666; }
</style>
</head>
<body>
  <h1>{{ title }}</h1>
  <div class="meta">
    <strong>Assessment:</strong> {{ assessment_id }}<br>
    <strong>Generated:</strong> {{ generated_at }}<br>
    <strong>Template:</strong> {{ template_name }}
  </div>

  {% block content %}{% endblock %}

  <div class="footer">
    <p>Generated by AstraIX Security Analyst &mdash; AI-powered VAPT Platform</p>
  </div>
</body>
</html>
