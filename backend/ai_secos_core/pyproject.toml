[build-system]
requires = ["setuptools>=68.0", "wheel", "pip>=23.0", "pydantic>=2.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-secos-core"
version = "0.1.0"
description = "Reusable runtime for AstraIX Security Analyst and future applications"
authors = [{name = "AstraIX Engineering", email = "engineering@astraix.ai"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache-2.0",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.9",
  "types-python-dateutil>=2.9",
]
dev = [
  "black>=24.4",
  "ipython>=8.22",
  "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
  "E",  # Pycodestyle
  "F",  # Pyflakes
  "UP", # Pyupgrade
  "N",  # PEP8-naming
  "I",  # isort
  "B",  # flake-bugbear
  "DTZ", # datetime
  "LOG", # logging
  "SIM", # flake-simplify
  "C90", # mccabe
]
ignore = [
  "E501",  # line-too-long (autofix handled by Black)
]
per-file-ignores = {
  "__init__.py" = ["F401", "F403"],
  "tests/*" = ["S101", "S106"]
}
format = {quote-style="double", indent-style="space", skip-magic-trailing-comma=true}

exclude = [".venv", ".git", ".pytest_cache", "tests/**/samples/**"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
no_implicit_optional = true
files = ["**/*.py"]
error_summary = true
json_report = "{cache_dir}/mypy.json"
html_report = "{cache_dir}/mypy.html"
disable_error_code = "type-arg"

[[tool.mypy.overrides]]
module = "ai_secos_core.infrastructure.migrations.*"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode="strict"
testpaths=["tests"]
python_files=["test_*.py"]
python_functions=["test_*"]
filterwarnings = [
  "ignore::DeprecationWarning:aiohttp",
]
addopts = [
  "-ra",
  "--tb=short",
  "--strict-markers",
  "--no-cov",
]
markers = [
  "unit: pure unit",
  "integration: cross-module or subprocess",
  "slow: > 1s",
]

[tool.coverage.run]
exclude=["**/test_*.py"]

[tool.coverage.report]
fail_under=90
exclude_lines={
  "pragma: no cover",
  "^\\s*raise AssertionError\\b",
}
