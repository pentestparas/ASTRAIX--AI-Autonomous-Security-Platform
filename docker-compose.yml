services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: astraix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-astraix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-astraix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astraix-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: astraix-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astraix-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: astraix-backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-astraix}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://127.0.0.1:3000"]'
      VAPT_DEMO_MODE: "false"
      VAPT_USE_DOCKER: "true"
      # Agent loop budget: 20 steps max, 40min hard timeout (a down LLM now
      # switches to a fast deterministic rotation instead of burning retries).
      VAPT_AGENT_MAX_STEPS: ${VAPT_AGENT_MAX_STEPS:-20}
      VAPT_AGENT_MIN_STEPS: ${VAPT_AGENT_MIN_STEPS:-8}
      VAPT_AGENT_TIMEOUT: ${VAPT_AGENT_TIMEOUT:-2400}
      # External VAPT platform adapters (backend/app/vapt/adapters)
      VAPT_ADAPTER_RACCOON: ${VAPT_ADAPTER_RACCOON:-true}
      VAPT_ADAPTER_LYRIE: ${VAPT_ADAPTER_LYRIE:-false}
      VAPT_ADAPTER_XALGORIX: ${VAPT_ADAPTER_XALGORIX:-false}
      VAPT_ADAPTER_DARKMOON: ${VAPT_ADAPTER_DARKMOON:-false}
      VAPT_ADAPTER_PENTAGI: ${VAPT_ADAPTER_PENTAGI:-false}
      VAPT_ADAPTER_REDAMON: ${VAPT_ADAPTER_REDAMON:-false}
      VAPT_ADAPTER_ZENAI: ${VAPT_ADAPTER_ZENAI:-false}
      XALGORIX_API_KEY: ${XALGORIX_API_KEY:-}
      XALGORIX_LLM: ${XALGORIX_LLM:-}
      XALGORIX_API_BASE: ${XALGORIX_API_BASE:-}
      DARKMOON_BASE_URL: ${DARKMOON_BASE_URL:-}
      DARKMOON_API_KEY: ${DARKMOON_API_KEY:-}
      DARKMOON_PATH: ${DARKMOON_PATH:-}
      PENTAGI_BASE_URL: ${PENTAGI_BASE_URL:-}
      PENTAGI_API_KEY: ${PENTAGI_API_KEY:-}
      PENTAGI_USER: ${PENTAGI_USER:-}
      PENTAGI_PASSWORD: ${PENTAGI_PASSWORD:-}
      REDAMON_BASE_URL: ${REDAMON_BASE_URL:-}
      REDAMON_API_KEY: ${REDAMON_API_KEY:-}
      ZENAI_REPO: ${ZENAI_REPO:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-ai/deepseek-v4-flash-0731}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-huihui_ai/qwen3-abliterated:14b-v2}
    volumes:
      # Backend code runs from the baked image copy (no host bind mount) so
      # host antivirus cannot delete or quarantine source files.
      # Knowledge base lives in a Docker-managed named volume (seeded from the
      # baked image copy on first boot), NOT on the host filesystem — so host
      # antivirus / file sync cannot delete or quarantine it.
      - kb-data:/app/knowledge-base
      - /var/run/docker.sock:/var/run/docker.sock
      - fastembed-cache:/root/.cache/fastembed
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
    networks:
      - astraix-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BACKEND_API_URL: http://backend:8000
    container_name: astraix-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
      - BACKEND_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - astraix-network
    restart: unless-stopped

  # Nginx Reverse Proxy — API with long timeout, frontend proxying
  nginx:
    image: nginx:alpine
    container_name: astraix-nginx
    ports:
      - "3001:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - astraix-network
    restart: unless-stopped

  # Neo4j Knowledge Graph — attack surface correlation
  neo4j:
    image: neo4j:5
    container_name: astraix-neo4j
    environment:
      # Keep NEO4J_AUTH=none only for local dev; set neo4j/<strong-password>
      # in .env for anything shared/production.
      NEO4J_AUTH: ${NEO4J_AUTH:-none}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    ports:
      - "7687:7687"
      - "7474:7474"
    networks:
      - astraix-network
    restart: unless-stopped

  # OWASP ZAP daemon — headless active/passive scanning (Burp-style) driven by
  # the agent via the REST API. Kali tool containers reach it as `zap:8080`.
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: astraix-zap
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.key=astraixzap
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    volumes:
      - zap-data:/zap/wrk/:rw
    ports:
      - "8090:8080"
    networks:
      - astraix-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8080/JSON/core/view/version?apikey=astraixzap' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  fastembed-cache:
    driver: local
  kb-data:
    driver: local
  neo4j_data:
    driver: local
  zap-data:
    driver: local

networks:
  astraix-network:
    driver: bridge
    name: astraix-network