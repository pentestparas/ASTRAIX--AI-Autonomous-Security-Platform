services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: astraix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-astraix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-astraix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astraix-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: astraix-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astraix-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: astraix-backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-astraix}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://127.0.0.1:3000"]'
      VAPT_DEMO_MODE: "false"
      VAPT_USE_DOCKER: "true"
      NEO4J_URI: bolt://neo4j:7687
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-ai/deepseek-v4-pro}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-huihui_ai/qwen2.5-abliterate:7b-instruct}
    volumes:
      - ./backend:/app
      - ./plugins:/app/plugins
      # Knowledge base lives in a Docker-managed named volume (seeded from the
      # baked image copy on first boot), NOT on the host filesystem — so host
      # antivirus / file sync cannot delete or quarantine it.
      - kb-data:/app/knowledge-base
      - /var/run/docker.sock:/var/run/docker.sock
      - fastembed-cache:/root/.cache/fastembed
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
    networks:
      - astraix-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BACKEND_API_URL: http://backend:8000
    container_name: astraix-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
      - BACKEND_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - astraix-network
    restart: unless-stopped

  # Nginx Reverse Proxy — API with long timeout, frontend proxying
  nginx:
    image: nginx:alpine
    container_name: astraix-nginx
    ports:
      - "3001:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - astraix-network
    restart: unless-stopped

  # Neo4j Knowledge Graph — attack surface correlation
  neo4j:
    image: neo4j:5
    container_name: astraix-neo4j
    environment:
      NEO4J_AUTH: none
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    ports:
      - "7687:7687"
      - "7474:7474"
    networks:
      - astraix-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  fastembed-cache:
    driver: local
  kb-data:
    driver: local
  neo4j_data:
    driver: local

networks:
  astraix-network:
    driver: bridge
    name: astraix-network